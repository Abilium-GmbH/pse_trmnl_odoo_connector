services:

  db:
    image: postgres:18.3
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
      POSTGRES_DB: ${POSTGRES_DB:-odoo}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  odoo:
    image: odoo:19.0-20260305
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8069:8069"
    volumes:
      - ./addons:/mnt/extra-addons:z
      - odoo_data:/var/lib/odoo
    environment:
      PGHOST: ${ODOO_DB_HOST:-db}
      PGUSER: ${ODOO_DB_USER:-odoo}
      PGPASSWORD: ${ODOO_DB_PASSWORD:-odoo}
      PGPORT: ${ODOO_DB_PORT:-5432}
      PGDATABASE: ${POSTGRES_DB:-odoo}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  odoo_data:
