version: '3.8'
services:
  db:
 image: postgres:13
 environment:

POSTGRES_DB=postgres
POSTGRES_USER=odoo
POSTGRES_PASSWORD=odoo volumes:
db-data:/var/lib/postgresql/data networks:
odoo-net
  odoo:
    image: odoo:16
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    volumes:
      - ./odoo-docker/addons:/mnt/extra-addons
    networks:
      - odoo-net

volumes:
  db-data:

networks:
  odoo-net:
