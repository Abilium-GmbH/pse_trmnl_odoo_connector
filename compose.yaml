services:
  db:
    image: postgres:18.3
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
      POSTGRES_DB: ${POSTGRES_DB:-odoo}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    image: odoo-custom:19.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "0.0.0.0:8069:8069"
    volumes:
      - ./addons:/mnt/extra-addons:z
      - odoo_data:/var/lib/odoo
    environment:
      HOST: ${ODOO_DB_HOST:-db}
      PORT: ${ODOO_DB_PORT:-5432}
      USER: ${ODOO_DB_USER:-odoo}
      PASSWORD: ${ODOO_DB_PASSWORD:-odoo}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: ["odoo", "--http-interface=0.0.0.0", "--dev=reload,xml"]

volumes:
  postgres_data:
  odoo_data:
